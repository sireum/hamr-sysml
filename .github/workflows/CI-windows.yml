name: Windows

on:
  push:
  schedule:
    - cron: "0 2 * * 6" # every saturday at 2am, as the hamr-codegen CIs
  workflow_dispatch:

# a new run of this workflow on the same ref cancels the one in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      runs-on: windows-latest
